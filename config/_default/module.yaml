imports: []
mounts:
  - source: archetypes
    target: archetypes
  - source: assets
    target: assets
  - source: content
    target: content
  - source: data
    target: data
  - source: i18n
    target: i18n
  - source: layouts
    target: layouts
  - source: static
    target: static
  - source: assets/images
    target: static/images
    excludeFiles: "**/.DS_Store"
