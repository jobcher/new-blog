<link rel="stylesheet" href="https://cdn.staticfile.org/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdn.staticfile.org/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdn.staticfile.org/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
  window.addEventListener("load", function () {
    var root = document.querySelector(".content");
    if (!root || !window.renderMathInElement) return;
    renderMathInElement(root, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\(", right: "\\)", display: false }
      ],
      throwOnError: false
    });
  });
</script>
