{{- $id := "" -}}
{{- $fullscreen := true -}}
{{- if .IsNamedParams -}}
  {{- $id = .Get "id" -}}
  {{- if isset .Params "fullscreen" }}{{ $fullscreen = .Get "fullscreen" }}{{ end -}}
{{- else -}}
  {{- $id = .Get 0 -}}
{{- end -}}
<div class="video">
  <iframe class="bilibili-frame" src="https://player.bilibili.com/player.html?bvid={{ $id }}" scrolling="no" border="0" frameborder="no" framespacing="0"{{ if $fullscreen }} allowfullscreen{{ end }} loading="lazy"></iframe>
</div>
