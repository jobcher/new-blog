<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="{{ if .IsPage }}layout-page{{ else }}layout-list{{ end }}" data-search-url="{{ "index.json" | relLangURL }}" data-copy-label="{{ i18n "copy" }}" data-copied-label="{{ i18n "copied" }}">
  <a class="skip" href="#content">{{ i18n "skip" }}</a>
  {{- partial "header.html" . -}}
  <main id="content">
    {{- block "main" . }}{{- end -}}
  </main>
  {{- partial "footer.html" . -}}
  {{- partial "scripts.html" . -}}
</body>
</html>
