{{ define "main" }}
<header class="page-head">
  <h1>{{ .Title }}</h1>
  {{- with .Parent }}
  <p class="lede"><a href="{{ .RelPermalink }}">{{ .Title }}</a></p>
  {{- end }}
</header>
{{- $paginator := .Paginate .Pages -}}
<div class="post-list">
{{- range $index, $post := $paginator.Pages }}
  {{- partial "post-item.html" (dict "page" $post "eager" (eq $index 0)) }}
{{- end }}
</div>
{{- partial "pagination.html" . }}
{{ end }}
